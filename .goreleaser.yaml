version: 2
project_name: packslip-goreleaser-scratch
builds:
  - id: dynamic
    binary: scratch-dynamic
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    tags: [dynamic]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: arm-softfloat
    binary: scratch-arm-softfloat
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm]
    goarm: ["7,softfloat"]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: levels
    binary: scratch-levels
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    goamd64: [v1, v3]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - id: dynamic
    ids: [dynamic]
    formats: [txz, tzst]
    name_template: "{{ .ProjectName }}_dynamic_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: arm-softfloat
    ids: [arm-softfloat]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_arm-softfloat_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: levels
    ids: [levels]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_levels_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Amd64 }}_{{ . }}{{ end }}"
checksum:
  name_template: checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
packslips:
  - ids: [dynamic]
    project: github.com/jdx/packslip-goreleaser-scratch/tools/dynamic
  - ids: [arm-softfloat]
    project: github.com/jdx/packslip-goreleaser-scratch/tools/arm-softfloat
  - ids: [levels]
    project: github.com/jdx/packslip-goreleaser-scratch/tools/levels
release:
  github:
    owner: jdx
    name: packslip-goreleaser-scratch
