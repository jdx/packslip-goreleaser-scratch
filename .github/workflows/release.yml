name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jdx/goreleaser
          ref: 63fb9074b877c088eb422fc59d7476a3d91446cd
          path: .goreleaser-src
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build goreleaser from the packslip branch
        working-directory: .goreleaser-src
        run: |
          git rev-parse HEAD
          go build -o "$RUNNER_TEMP/goreleaser" .
      - name: Release
        run: |
          rm -rf .goreleaser-src
          "$RUNNER_TEMP/goreleaser" release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
